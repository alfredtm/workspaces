# Tag vX.Y.Z → images get :X.Y.Z (images.yml), the Helm chart is published
# to oci://ghcr.io/<owner>/charts/workspaces:X.Y.Z with appVersion X.Y.Z,
# and a GitHub release with generated notes is created.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  chart:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
      - name: Package and push the chart
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin <<< "$TOKEN"
          helm package charts/workspaces --version "$version" --app-version "$version" -d /tmp/chart
          helm push "/tmp/chart/workspaces-$version.tgz" "oci://ghcr.io/${OWNER,,}/charts"
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
