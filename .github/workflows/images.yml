# Builds and publishes every image to ghcr.io/<owner>/<repo>:
#
#   <registry>             the workspace image (editor layer, FROM base)
#   <registry>/base        toolchains: Go, Node, Python, Claude Code, OpenCode
#   <registry>/manager     control plane + embedded portal (ko)
#   <registry>/port-router (ko)
#   <registry>/authproxy   (ko; copied into the workspace image)
#
# Runs on pushes to main (tags :<sha> and :latest) and on version tags
# v1.2.3 (adds :1.2.3). Pull requests are covered by ci.yml.
name: images

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io/${{ github.repository }}

jobs:
  tags:
    runs-on: ubuntu-latest
    outputs:
      # space-separated tag names for every image in this run
      list: ${{ steps.t.outputs.list }}
      csv: ${{ steps.t.outputs.csv }}
    steps:
      - id: t
        env:
          REF: ${{ github.ref }}
        run: |
          tags="${GITHUB_SHA}"
          case "$REF" in
            refs/heads/main) tags="$tags latest" ;;
            refs/tags/v*)    tags="$tags ${REF#refs/tags/v}" ;;
          esac
          echo "list=$tags" >> "$GITHUB_OUTPUT"
          echo "csv=${tags// /,}" >> "$GITHUB_OUTPUT"

  ko:
    needs: tags
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        component: [manager, port-router, authproxy]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Load tooling versions
        run: grep -E '^[A-Z_]+=' versions.txt >> "$GITHUB_ENV"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: services/${{ matrix.component }}/go.mod
      # The manager embeds the portal (go:embed uidist): build it first.
      - if: matrix.component == 'manager'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ui/portal/package-lock.json
      - if: matrix.component == 'manager'
        name: Build the portal
        working-directory: ui/portal
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - uses: ko-build/setup-ko@61b4d1d396f5b2e7d6bb6fefdce3dc38d1a13445 # v0.10
      - name: Log in to ghcr.io
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ko login ghcr.io -u "${{ github.actor }}" --password-stdin <<< "$TOKEN"
      - name: ko build
        working-directory: services/${{ matrix.component }}
        env:
          KO_DOCKER_REPO: ${{ env.REGISTRY }}/${{ matrix.component }}
          TAGS: ${{ needs.tags.outputs.csv }}
        run: ko build . --bare --platform=linux/amd64 --tags "$TAGS"

  base:
    needs: tags
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Hosted runners have ~14 GB free; the image is several GB.
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost \
            /opt/hostedtoolcache/CodeQL "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}/Python" 2>/dev/null || true
          sudo docker image prune -af >/dev/null 2>&1 || true
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Load tooling versions
        run: grep -E '^[A-Z_]+=' versions.txt >> "$GITHUB_ENV"
      - id: names
        env:
          TAGS: ${{ needs.tags.outputs.list }}
        run: |
          { echo 'tags<<EOF'; for t in $TAGS; do echo "$REGISTRY/base:$t"; done; echo EOF; } >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: images/workspace/base
          push: true
          build-args: |
            GO_VERSION=${{ env.GO_VERSION }}
            NODE_VERSION=${{ env.NODE_VERSION }}
            CLAUDE_CODE_VERSION=${{ env.CLAUDE_CODE_VERSION }}
            OPENCODE_VERSION=${{ env.OPENCODE_VERSION }}
          tags: ${{ steps.names.outputs.tags }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/base:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/base:buildcache,mode=max,image-manifest=true,oci-mediatypes=true
          provenance: false

  # The Theia app is built on the runner into a tarball; the image build then
  # only copies it in, which keeps it inside a hosted runner's disk.
  theia:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Theia's native modules are built for Node 20, which ships in the tarball.
          node-version: 20
          cache: npm
          cache-dependency-path: ui/theia/package-lock.json
      - run: images/workspace/build-theia.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: theia-image
          path: ui/theia/dist-image/theia.tar.gz
          retention-days: 1
          compression-level: 0

  workspace:
    needs: [tags, ko, base, theia]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost \
            /opt/hostedtoolcache/CodeQL "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}/Python" 2>/dev/null || true
          sudo docker image prune -af >/dev/null 2>&1 || true
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: theia-image
          path: ui/theia/dist-image
      - id: names
        env:
          TAGS: ${{ needs.tags.outputs.list }}
        run: |
          { echo 'tags<<EOF'; for t in $TAGS; do echo "$REGISTRY:$t"; done; echo EOF; } >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: images/workspace/Dockerfile
          push: true
          build-args: |
            BASE_IMAGE=${{ env.REGISTRY }}/base:${{ github.sha }}
            AUTHPROXY_IMAGE=${{ env.REGISTRY }}/authproxy:${{ github.sha }}
          tags: ${{ steps.names.outputs.tags }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true
          provenance: false
