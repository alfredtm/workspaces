{{- if not .Values.oidc.existingSecret }}
{{- if or (not .Values.oidc.issuer) (not .Values.oidc.clientId) }}
{{- fail "set oidc.issuer and oidc.clientId (or oidc.existingSecret)" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: manager-oidc
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "workspaces.labels" . | nindent 4 }}
type: Opaque
stringData:
  OIDC_ISSUER: {{ .Values.oidc.issuer | quote }}
  OIDC_CLIENT_ID: {{ .Values.oidc.clientId | quote }}
  OIDC_CLIENT_SECRET: {{ .Values.oidc.clientSecret | quote }}
{{- end }}
{{- if not .Values.session.existingSecret }}
---
# Session signing keys: generated once, then reused on every upgrade (a new
# key would log everyone out).
{{- $existing := lookup "v1" "Secret" .Release.Namespace "manager-session" }}
apiVersion: v1
kind: Secret
metadata:
  name: manager-session
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "workspaces.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if $existing }}
  SESSION_PRIVATE_KEY: {{ index $existing.data "SESSION_PRIVATE_KEY" }}
  CSRF_KEY: {{ index $existing.data "CSRF_KEY" }}
  {{- else }}
  SESSION_PRIVATE_KEY: {{ randBytes 32 | b64enc }}
  CSRF_KEY: {{ randBytes 32 | b64enc }}
  {{- end }}
{{- end }}
{{- if and .Values.inference.providers (not .Values.inference.existingSecret) }}
---
# Inference providers → LLM_* (first provider) and LLM_<n>_* env in every
# workspace, through envFrom on this Secret.
apiVersion: v1
kind: Secret
metadata:
  name: workspace-inference
  namespace: {{ include "workspaces.workspaceNamespace" . }}
  labels:
    {{- include "workspaces.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $i, $p := .Values.inference.providers }}
  {{- $prefix := ternary "LLM_" (printf "LLM_%d_" (add $i 1)) (eq $i 0) }}
  {{ $prefix }}BASE_URL: {{ required "inference.providers[].baseUrl is required" $p.baseUrl | quote }}
  {{ $prefix }}API_KEY: {{ $p.apiKey | default "" | quote }}
  {{ $prefix }}MODELS: {{ required "inference.providers[].models is required" $p.models | quote }}
  {{ $prefix }}LABEL: {{ $p.label | default "Inference" | quote }}
  {{- with $p.context }}
  {{ $prefix }}CONTEXT: {{ . | quote }}
  {{- end }}
  {{- with $p.output }}
  {{ $prefix }}OUTPUT: {{ . | quote }}
  {{- end }}
  {{- with $p.reasoning }}
  {{ $prefix }}REASONING: {{ . | quote }}
  {{- end }}
  {{- with $p.reasoningOptions }}
  {{ $prefix }}REASONING_OPTIONS: {{ . | quote }}
  {{- end }}
  {{- with $p.images }}
  {{ $prefix }}IMAGES: {{ . | quote }}
  {{- end }}
  {{- end }}
{{- end }}
