# The manager only ever touches the workspace namespace, so a namespaced
# Role is enough. No access to Secrets anywhere.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: manager
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "workspaces.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: workspaces-manager
  namespace: {{ include "workspaces.workspaceNamespace" . }}
  labels:
    {{- include "workspaces.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [persistentvolumeclaims, services]
    verbs: [get, list, create, update, patch, delete]
  # Read-only: explains a slow start on the portal card (image pull, volume
  # attach, scheduling) from container states and the latest Warning event.
  - apiGroups: [""]
    resources: [pods, events]
    verbs: [get, list]
  # patch: activity and lifecycle annotations.
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: workspaces-manager
  namespace: {{ include "workspaces.workspaceNamespace" . }}
  labels:
    {{- include "workspaces.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: manager
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: workspaces-manager
  apiGroup: rbac.authorization.k8s.io
